<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>기후변화 탐험대</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eefaf1;--card:#fff;--tx:#17301f;--ac:#1f9d55;--ac2:#ff7a3d;--bd:#cfe6d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201a;--card:#183027;--tx:#e8f6ec;--bd:#2c5242}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
h1{margin:0;padding:14px;text-align:center;font-size:22px}
nav{display:flex;gap:6px;padding:0 8px 8px;flex-wrap:wrap;justify-content:center}
nav button,.b{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:700;background:var(--ac);color:#fff;cursor:pointer}
nav button.on{background:var(--ac2)}.b.o{background:var(--ac2)}.b.g{background:#6b7c72}
main{max-width:900px;margin:auto;padding:8px}
section{display:none}section.on{display:block}
.c{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px;margin:8px 0}
textarea,select,input[type=range]{width:100%;font:inherit;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px}
textarea{min-height:200px}
.chip{display:inline-block;margin:3px;padding:6px 10px;border-radius:20px;background:var(--bg);border:2px solid var(--bd);cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--ac)}
a{color:var(--ac2);font-weight:700}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bar{height:16px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2)}
.big{font-size:40px;text-align:center}@keyframes pp{from{transform:scale(0)}to{transform:scale(1)}}@keyframes fl{to{transform:translateY(-60px);opacity:0}}.m{position:absolute;font-size:52px;cursor:pointer;animation:pp .2s;user-select:none;touch-action:manipulation}.fl{position:absolute;font-weight:900;font-size:22px;color:#ff5a1f;animation:fl .7s forwards;pointer-events:none;white-space:nowrap}
</style></head><body>
<h1>🌍 기후변화 탐험대</h1>
<nav id="nv"></nav>
<main>
<section id="s0">
<div class="c"><b>① 예시 랩 불러오기</b> (그대로 써도 좋고 고쳐 써도 좋아요)<div id="sm"></div></div>
<div class="c"><b>② 한 줄씩 골라서 만들기</b> (누르면 아래 노랫말에 추가돼요)<div id="pk"></div></div>
<div class="c"><b>③ 내 노랫말</b> (직접 새로 써도 돼요! 한 줄 = 한 마디)<textarea id="ta" placeholder="여기에 직접 써 보세요"></textarea>
<button class="b g" onclick="ta.value=''">싹 지우기</button></div>
<div class="c"><b>④ AI 목소리 + 비트</b>
<div class="g2"><label>비트<select id="st"><option value="0">붐뱁 (묵직)</option><option value="1">트랩 (빠른 하이햇)</option><option value="2">신나는 댄스</option></select></label>
<label>목소리<select id="pi"><option value="1.7">아기 AI</option><option value="1" selected>보통 AI</option><option value="0.6">걸걸 AI</option></select></label>
<label>속도 <input id="rt" type="range" min="0.7" max="1.8" step="0.1" value="1.1"></label>
<label>비트 빠르기 <input id="bpm" type="range" min="70" max="150" value="95"></label></div>
<p><button class="b" onclick="rap()">🎤 랩 시작!</button> <button class="b o" onclick="stopAll()">⏹ 멈춤</button> <button class="b g" onclick="navigator.clipboard&&navigator.clipboard.writeText(ta.value)">📋 복사</button></p>
<small>※ 소리가 안 나면 태블릿 볼륨과 무음 모드를 확인해요. 기기에 한국어 음성이 있어야 해요.</small></div>
</section>

<section id="s1">
<div class="c"><b>🎯 조사 미션</b> <button class="b o" onclick="mission()">랜덤 미션 뽑기!</button><div id="ms" style="margin-top:8px"></div></div>
<p>👇 주황색 글을 누르면 읽을 글이 바로 열려요! 조사한 주제 <b id="cnt">0</b>/<span id="tot"></span> 완료</p>
<div id="rs"></div>
<div class="c"><b>📓 내 조사 노트</b><textarea id="nt" placeholder="주제 / 알게 된 점 / 출처 이름(사이트 이름) / 내 생각"></textarea></div>
</section>

<section id="s2">
<div id="gm"></div>
</section>

<section id="s3"><div id="qz"></div></section>
</main>
<script>
const $=s=>document.querySelector(s),ta=$('#ta');
const T=['🎤 랩 만들기','🔎 기후 조사','🎮 탄소 몬스터 팡팡!','📝 퀴즈'];
T.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>go(i);$('#nv').appendChild(b)});
function go(i){document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('on',i==j));document.querySelectorAll('nav button').forEach((s,j)=>s.classList.toggle('on',i==j));if(i!=0)stopAll()}
/* ---------- 랩 ---------- */
const SONGS=[
['🔥 뜨거워진 지구',`에어컨 빵빵 밖은 지글지글 지구가 열이 나 열이 나
여름은 길어지고 겨울은 짧아져 달력이 헷갈려 계절이 울어
북극곰 발밑 얼음이 녹아 갈 곳을 잃고 둥둥 떠다녀
이산화탄소 이불처럼 덮여 지구가 답답해 숨을 못 쉬어
지구야 지구야 아프지 마 우리가 지킬게 약속할게
끄고 아끼고 줄이고 심고 작은 실천이 큰 파도 돼`],
['🌊 물폭탄 SOS',`하늘이 뚫린 듯 쏟아지는 비 길이 강이 되고 강이 넘쳐
바다는 점점 차올라 오고 섬나라 친구들 집을 잃어
폭염 다음엔 폭설이 오고 한파가 와서 꽁꽁 얼어
날씨가 왜 이리 극과 극일까 기후변화가 원인이래
뉴스를 보지 말고 행동하자 오늘부터 우리 시작하자
기후위기 막는 건 바로 너와 나 함께하면 할 수 있어`],
['🦸 나는야 지구 히어로',`나는야 지구 히어로 망토는 없지만 마음은 슈퍼
텀블러 들고 다니면 일회용 컵아 안녕 바이바이
가까운 길은 걸어가고 안 쓰는 플러그 쏙 뽑아
잔반은 남기지 않고 분리배출은 척척 정확하게
나무 한 그루 심어 보자 시원한 그늘 만들어 줘
탄소를 줄이는 우리 모두 지구를 지키는 히어로야`],
['🐻‍❄️ 북극곰의 편지',`안녕 나는 북극곰이야 내 얼음집이 작아졌어
바다에 떠 있는 얼음 위에서 오늘도 밥을 찾고 있어
너희가 쓰는 전기와 기름 그게 하늘에 쌓여서
지구를 따뜻하게 만들었대 나는 더워서 힘들어
부탁이야 조금만 아껴 줘 우리 같이 살아가자
얼음이 돌아오는 그날까지 나는 기다릴게 고마워`]];
const PK={'🌡️ 원인':['공장 굴뚝 자동차 연기 하늘로 올라가 이불이 돼','석탄 석유를 너무 태워서 이산화탄소가 쌓여 가','숲이 사라져 나무가 줄어 탄소 먹을 친구가 없어','전기를 펑펑 쓸 때마다 지구 온도가 올라가'],
'⚡ 현상':['폭염 열대야 잠 못 자는 밤 땀이 주르륵 흘러내려','한파 폭설 꽁꽁 얼어 길도 마음도 미끄러워','쏟아지는 비 넘치는 강 홍수가 마을을 덮쳐','산불이 번져 숲이 타고 동물 친구들 갈 곳이 없어','바닷물이 차올라서 해안가 마을이 위험해'],
'💚 마음':['모른 척하기엔 지구가 너무 소중해','우리 아이들이 살아갈 미래를 지켜 줘','작은 힘도 모이면 파도가 되는 거야','지금 시작해 내일은 이미 늦어'],
'🌱 실천':['안 쓰는 불 끄고 플러그 뽑고 에너지를 아껴','텀블러 장바구니 챙겨 일회용품 바이바이','가까운 길은 걸어가고 대중교통 타고 가','분리배출 똑바로 하고 음식은 남기지 말자','나무를 심고 가꾸는 일 지구를 위한 선물이야']};
$('#sm').innerHTML=SONGS.map((s,i)=>`<span class="chip" onclick="ta.value=SONGS[${i}][1]">${s[0]}</span>`).join('');
$('#pk').innerHTML=Object.entries(PK).map(([k,v])=>`<p><b>${k}</b><br>`+v.map(l=>`<span class="chip" onclick="ta.value+=(ta.value?'\\n':'')+this.textContent">${l}</span>`).join('')+'</p>').join('');
const PT=[['x...x...x..x....','....x.......x...','x.x.x.x.x.x.x.x.'],['x.....x...x.....','........x.......','xxxxxxxxxxxxxxxx'],['x...x...x...x...','....x.......x...','..x...x...x...x.']].map(a=>a.map(s=>[...s].map(c=>c=='x')));
let ac,tm,sp=0,run=0,nb;
const FQ=n=>220*Math.pow(2,n/12),RT=[0,-4,-2,-5],LD=[[7,-1,-1,10,-1,7,-1,-1,5,-1,-1,7,-1,3,-1,-1],[12,-1,10,-1,7,-1,10,-1,12,-1,15,-1,12,-1,10,-1],[7,7,-1,10,12,-1,10,7,7,7,-1,10,12,-1,15,12]],MX=['1.8,1','1,1','0.5,0.9','1.3,1.2','0.8,1.3'],KV=[];
function nt(f,t,d,ty,v){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
function lv(){const v=speechSynthesis.getVoices().filter(x=>(x.lang||'').toLowerCase().startsWith('ko'));KV.length=0;KV.push(...v);$('#vo').innerHTML=v.length?v.map((x,i)=>`<option value="${i}">${x.name}</option>`).join(''):'<option value="0">기본 목소리</option>'}

function noise(t,d,f,v){const s=ac.createBufferSource();s.buffer=nb;const fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=f;const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start(t);s.stop(t+d)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.3)}
function beat(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();if(!nb){nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
const p=PT[+$('#st').value],d=60/$('#bpm').value/4;sp=0;clearInterval(tm);tm=setInterval(()=>{const g=sp,s=sp++%16,t=ac.currentTime,r=RT[(g>>4)%4],y=+$('#st').value;if(p[0][s]){kick(t);nt(FQ(r-12),t,d*3,'triangle',.3)}if(p[1][s])noise(t,.15,1200,.5);if(p[2][s])noise(t,.04,7000,.2);const m=LD[y][s];if(m>=0)nt(FQ(r+m+12),t,d*2,y?'square':'triangle',y?.05:.14)},d*1000)}
function stopAll(){run=0;clearInterval(tm);if(window.speechSynthesis)speechSynthesis.cancel()}
function rap(){const L=ta.value.split('\n').filter(x=>x.trim());if(!L.length){alert('노랫말을 먼저 만들어 보세요!');return}
stopAll();run=1;beat();let i=0;(function n(){if(!run||i>=L.length){stopAll();return}const u=new SpeechSynthesisUtterance(L[i++]);u.lang='ko-KR';u.rate=+$('#rt').value;u.pitch=+$('#pi').value;u.onend=()=>setTimeout(n,250);u.onerror=stopAll;speechSynthesis.speak(u)})()}
/* ---------- 조사 ---------- */
const W=t=>['위키백과 '+t,'https://ko.wikipedia.org/wiki/'+t];
const KMA=['기상청 날씨누리','https://www.weather.go.kr'],CP=['기상청 기후정보포털','https://www.climate.go.kr'],SK=['국민재난안전포털','https://www.safekorea.go.kr'];
const R0=[
['🥵','폭염','우리나라에서 폭염이 가장 심했던 해는 언제일까?|폭염과 열대야는 무엇이 다를까?|폭염에 몸을 지키는 방법 5가지는?','폭염 원인, 열대야 뜻, 폭염 피해, 폭염 대처법',[KMA,CP,W('폭염')]],
['🥶','한파','한파는 어떤 날씨를 말할까?|지구가 더워지는데 왜 한파가 오기도 할까?|한파 때 조심할 것은?','한파 뜻, 한파 특보 기준, 북극 한파, 한파 대비',[KMA,SK,W('한파')]],
['🌊','홍수','홍수는 왜 생길까?|최근 우리나라에서 큰 비 피해가 있었던 곳은?|홍수 때 행동 요령은?','집중호우, 장마, 홍수 피해 사례, 침수 대피',[SK,KMA,W('홍수')]],
['❄️','폭설','폭설은 눈이 얼마나 오는 것일까?|폭설로 생기는 피해는?|눈이 많이 오는 지역은 어디일까?','대설 특보, 폭설 피해, 제설 작업',[KMA,SK,W('폭설')]],
['🏜️','가뭄','가뭄은 왜 생길까?|가뭄이 농사와 물 사용에 주는 영향은?|물을 아끼는 방법은?','가뭄 원인, 물 부족 국가, 가뭄 피해',[SK,CP,W('가뭄')]],
['🔥','산불','산불은 어떻게 번질까?|기후변화와 산불의 관계는?|산불 예방 수칙은?','산불 원인, 대형 산불, 산불 예방',[SK,W('산불')]],
['🌀','태풍','태풍은 어디서 어떻게 생길까?|바다가 따뜻해지면 태풍은 어떻게 될까?|태풍 이름은 누가 붙일까?','태풍 발생, 태풍 이름, 태풍 피해',[KMA,W('태풍')]],
['🧊','빙하와 해수면','빙하가 녹으면 바다 높이는 어떻게 될까?|해수면 상승으로 위험한 나라와 도시는?|북극곰은 왜 힘들까?','해수면 상승, 빙하 감소, 북극 얼음, 투발루',[['NASA 해수면 (영어)','https://climate.nasa.gov/vital-signs/sea-level/'],['NASA 어린이 기후 사이트 (영어)','https://climatekids.nasa.gov/'],W('해수면_상승')]],
['🌡️','지구온난화 원리','온실효과는 어떻게 일어날까?|온실가스에는 무엇이 있을까?|지구 평균 기온은 얼마나 올랐을까?','온실효과, 온실가스, 지구 평균기온 상승',[W('지구_온난화'),W('온실_가스'),CP]],
['🐝','동식물과 농사','기후변화로 사과·귤 재배지는 어떻게 달라질까?|꿀벌과 곤충은 왜 줄어들까?|바다 생물에는 어떤 변화가 있을까?','재배지 북상, 꿀벌 감소, 산호 백화, 어종 변화',[['WWF 한국','https://www.wwfkorea.or.kr'],CP]],
